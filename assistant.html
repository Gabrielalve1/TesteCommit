<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BYD Assistente</title><style>html,body{margin:0;height:100%;background:#0b0d10;color:#fff;font-family:Arial,sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.orb{width:120px;height:120px;border-radius:50%;background:#00c853;box-shadow:0 0 70px #00c85366;margin-bottom:28px;transition:.2s}.listening{transform:scale(1.12);box-shadow:0 0 100px #00c853}.speaking{background:#00a8ff;box-shadow:0 0 100px #00a8ff}h1{font-size:34px;margin:0 0 10px}.status{font-size:22px;color:#7cff9b;margin-bottom:20px;text-align:center}.text{font-size:20px;color:#ddd;max-width:900px;text-align:center;min-height:70px}.setup{margin-top:25px;width:min(900px,95%);display:flex;gap:10px}input{flex:1;padding:14px;border-radius:10px;border:1px solid #333;background:#1b1f25;color:white;font-size:18px}button{padding:14px 24px;border:0;border-radius:10px;background:#00c853;color:#07140b;font-weight:700;font-size:18px}</style></head><body><main><div id="orb" class="orb"></div><h1>BYD Assistente</h1><div id="status" class="status">Cole sua chave NVIDIA e ative</div><div id="text" class="text">Depois disso, é só falar. Ela volta a ouvir sozinha.</div><div id="setup" class="setup"><input id="key" type="password" placeholder="nvapi-..."><button id="go">ATIVAR</button></div></main><script>const statusEl=document.getElementById('status'),textEl=document.getElementById('text'),orb=document.getElementById('orb'),setup=document.getElementById('setup'),keyEl=document.getElementById('key');let key=localStorage.getItem('nvidia_key')||'';keyEl.value=key;let active=false,rec=null,speaking=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function setStatus(s,c){statusEl.textContent=s;orb.className='orb'+(c?' '+c:'')}function initRec(){if(!SR){setStatus('Este navegador não tem reconhecimento de voz');return}rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>setStatus('Ouvindo...','listening');rec.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else textEl.textContent='Você: '+t}if(final){textEl.textContent='Você: '+final;rec.stop();ask(final)}};rec.onerror=e=>{if(active&&!speaking)setTimeout(listen,900)};rec.onend=()=>{if(active&&!speaking)setTimeout(listen,350)}}function listen(){if(!active||speaking||!rec)return;try{rec.start()}catch(e){setTimeout(listen,700)}}async function ask(q){setStatus('Pensando...');try{let r=await fetch('https://integrate.api.nvidia.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:'meta/llama-3.1-8b-instruct',temperature:.6,max_tokens:180,stream:false,messages:[{role:'system',content:'Você é uma assistente de voz automotiva. Responda sempre em português brasileiro, de forma natural, curta e conversacional. Não use markdown.'},{role:'user',content:q}]})});let j=await r.json();if(!r.ok)throw new Error('HTTP '+r.status+' '+JSON.stringify(j));let a=j.choices[0].message.content.trim();textEl.textContent='Assistente: '+a;say(a)}catch(e){textEl.textContent='Erro: '+e.message;setStatus('Falha na conexão');setTimeout(listen,1600)}}function say(t){speaking=true;try{rec&&rec.abort()}catch(e){}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1.02;let voices=speechSynthesis.getVoices();let pt=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt-br'))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt'));if(pt)u.voice=pt;u.onstart=()=>setStatus('Falando...','speaking');u.onend=()=>{speaking=false;setTimeout(listen,300)};u.onerror=()=>{speaking=false;setTimeout(listen,500)};speechSynthesis.speak(u)}document.getElementById('go').onclick=()=>{key=keyEl.value.trim();if(!key){setStatus('Cole a chave NVIDIA');return}localStorage.setItem('nvidia_key',key);active=true;setup.style.display='none';initRec();say('Pronto. Estou ouvindo. Pode falar comigo.')};</script></body></html>
