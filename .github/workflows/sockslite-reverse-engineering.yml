name: SocksLite authorized APK reverse engineering

on:
  workflow_dispatch:
    inputs:
      sample_url:
        description: "Direct HTTPS download URL for the XAPK/APK you are authorized to analyze"
        required: true
        type: string

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout analysis scripts
        uses: actions/checkout@v4

      - name: Validate and download sample
        env:
          SAMPLE_URL: ${{ inputs.sample_url }}
        run: |
          python - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ["SAMPLE_URL"])
          if u.scheme != "https" or not u.netloc:
              raise SystemExit("Provide a direct HTTPS download URL.")
          print("URL scheme/host validated; query strings and credentials are not logged.")
          PY
          mkdir -p work/input work/output
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "$SAMPLE_URL" -o work/input/sample.bin
          file work/input/sample.bin
          if ! unzip -t work/input/sample.bin >/dev/null 2>&1; then
            echo "Downloaded file is not a valid ZIP-based APK/XAPK/APKS archive."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download official JADX release
        run: |
          python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/skylot/jadx/releases/latest",
              headers={"Accept":"application/vnd.github+json","User-Agent":"sockslite-analysis-workflow"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = release.get("assets", [])
          candidates = [a for a in assets if a["name"].endswith(".zip") and a["name"].startswith("jadx-")]
          if not candidates:
              raise SystemExit("Could not find an official JADX ZIP release asset.")
          asset = candidates[0]
          print("JADX release:", release.get("tag_name"))
          urllib.request.urlretrieve(asset["browser_download_url"], "/tmp/jadx.zip")
          PY
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          JADXBIN="$(find /tmp/jadx -type f -path '*/bin/jadx' | head -n 1)"
          test -n "$JADXBIN"
          chmod +x "$JADXBIN"
          echo "JADXBIN=$JADXBIN" >> "$GITHUB_ENV"
          "$JADXBIN" --version

      - name: Extract package and decompile
        run: |
          mkdir -p work/input/extracted work/output
          unzip -q work/input/sample.bin -d work/input/extracted
          find work/input/extracted -type f \( -name '*.apk' -o -name '*.dex' \) -print
          mapfile -t APKS < <(find work/input/extracted -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APKs found inside the downloaded archive."
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            name="$(basename "$apk" .apk)"
            mkdir -p "work/output/$name"
            "$JADXBIN" --deobf --show-bad-code -j 2 \
              -d "work/output/$name" "$apk" \
              >"work/output/$name/jadx.log" 2>&1 || {
                echo "JADX reported errors for $name; preserving partial output."
              }
          done
          sha256sum work/input/sample.bin > work/output/SAMPLE_SHA256.txt
          {
            echo "# Automated static analysis run"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Sample SHA-256: $(cut -d' ' -f1 work/output/SAMPLE_SHA256.txt)"
            echo
            echo "This is static decompilation only. It does not prove runtime behavior, identify a working server, or validate a VPN connection."
            echo "Review the manifest, VPN service classes, native libraries, tunnel protocol code, and configuration import/export paths."
          } > work/output/README-RESULTS.md

      - name: Upload decompilation results
        uses: actions/upload-artifact@v4
        with:
          name: sockslite-static-decompilation
          path: work/output/
          if-no-files-found: error
          retention-days: 3
