name: Build BYD Assistant APK

on:
  push:
    branches: ["byd-assistant-prototype"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle offline Brazilian Portuguese speech model
        run: |
          set -eux
          rm -rf app/src/main/assets/model-pt /tmp/vosk-pt
          mkdir -p app/src/main/assets/model-pt /tmp/vosk-pt
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o /tmp/vosk-pt.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          cp -R /tmp/vosk-pt/vosk-model-small-pt-0.3/. app/src/main/assets/model-pt/
          printf 'byd-luna-pt-0.2-gold\n' > app/src/main/assets/model-pt/uuid

      - name: Build Gold debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BYD-Luna-Gold-debug
          path: app/build/outputs/apk/debug/app-debug.apk
